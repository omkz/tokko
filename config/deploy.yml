# Name of your application. Used to uniquely configure containers.
service: tokko

# Name of the container image (use your-user/app-name on external registries).
image: tokko

# Deploy to these servers.
servers:
  web:
    - 192.168.0.1
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

proxy:
  # Kamal proxy healthchecks the app at this path before routing traffic to
  # it and during rolling deploys. Rails' built-in /up (rails/health#show) is
  # a lightweight liveness/boot check — it does not depend on the database,
  # Stripe, or SMTP, so a container only reports healthy once it can serve
  # requests at all.
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

  # Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
  # If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
  #
  # Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
  #
  # Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
  #
  # ssl: true
  # host: shop.example.com

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - TOKKO_DATABASE_PASSWORD

    # Only needed if your SMTP provider requires authentication. Kamal
    # requires every listed secret to actually be defined when it reads
    # .kamal/secrets, so leave these commented out for unauthenticated/relay
    # SMTP setups rather than forcing operators to invent values.
    # - SMTP_USERNAME
    # - SMTP_PASSWORD
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # PostgreSQL connection for config/database.yml's production primary
    # (defaults: DB_PORT 5432, DB_USERNAME tokko). For a typical Kamal/
    # container deployment, set DB_HOST to the hostname or IP address of
    # your PostgreSQL server. Leaving DB_HOST unset connects over a local
    # Unix socket instead of TCP, which only works if that socket is
    # actually available to the application container.
    # DB_HOST: 192.168.0.2
    # DB_PORT: 5432
    # DB_USERNAME: tokko

    # Used to build links in mailer templates (see docs/operations/deployment.md). Replace with your real domain.
    # APP_HOST: shop.example.com
    # APP_PROTOCOL: https

    # Default "from" address for outgoing mail. Replace with your real address.
    # MAIL_FROM: no-reply@shop.example.com

    # Outgoing SMTP server (defaults: SMTP_PORT 587, SMTP_AUTHENTICATION plain).
    # Leave unset to fall back to localhost, or pair with SMTP_USERNAME/SMTP_PASSWORD
    # above if your provider requires authentication.
    # SMTP_ADDRESS: smtp.example.com
    # SMTP_PORT: 587
    # SMTP_DOMAIN: shop.example.com
    # SMTP_AUTHENTICATION: plain

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persists local Active Storage files (product images, etc.) across deploys.
# Tokko's database is PostgreSQL, managed separately — this volume only holds
# uploaded files. It must be included in your backup strategy alongside the
# database; see docs/operations/backup-and-restore.md.
volumes:
  - "tokko_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.3
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Kamal supports running accessory services (databases, Redis, etc.) alongside
# the app — see https://kamal-deploy.org/docs/configuration/accessories/.
# Tokko doesn't require any and assumes PostgreSQL is provisioned separately
# unless you deliberately add one here.
